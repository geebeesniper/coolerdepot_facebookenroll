# CoolerDepot site-wide branded HTTP error pages.
# Current path deployment:
#   /opt/coolerdepot/www/sales-posts
#
# Add these directives to apache/php-fpm.conf inside the Apache container build.
# These catch errors that happen BEFORE a request reaches the Sales Post Tracker router,
# such as http://SERVER/admin or any other missing root-level URL.

ErrorDocument 400 /sales-posts/http-status.php?code=400
ErrorDocument 403 /sales-posts/http-status.php?code=403
ErrorDocument 404 /sales-posts/http-status.php?code=404
ErrorDocument 405 /sales-posts/http-status.php?code=405
ErrorDocument 408 /sales-posts/http-status.php?code=408
ErrorDocument 421 /sales-posts/http-status.php?code=421
ErrorDocument 429 /sales-posts/http-status.php?code=429
ErrorDocument 500 /sales-posts/http-status.php?code=500
ErrorDocument 502 /sales-posts/http-status.php?code=502
ErrorDocument 503 /sales-posts/http-status.php?code=503

# 401 is intentionally not overridden here because the current site uses Apache Basic Auth
# on <Location "/">. Replacing that 401 page can interfere with the browser authentication challenge.
#
# 301/302 are redirects, not server error documents. Application redirects already use the
# Sales Post Tracker branded redirect fallback page.
